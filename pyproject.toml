[project]
name = "organon"
version = "0.1.0"
description = "Outil taxonomique"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "certifi>=2024.7.4",
    "requests>=2.31",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["organon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Sans ça, deux `test_module.py` de même nom dans des sous-dossiers différents (un par module,
# ex. tests/modules/wsc et tests/modules/reptile_database) entrent en conflit d'import faute de
# `__init__.py` — `importlib` les identifie par leur chemin plutôt que par ce nom partagé.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D", "W505", "BLE", "RUF100", "ERA001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["organon.core.*", "organon.api.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
