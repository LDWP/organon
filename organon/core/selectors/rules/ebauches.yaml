# Règles de correspondance rang taxonomique -> {{ébauche|...}}, évaluées dans l'ordre (la
# première qui matche l'emporte) — voir organon.core.selectors.categorization.wp_ebauche.
# Fichier maintenu à la main : créer un ebauches.local.yaml pour des règles spécifiques
# plutôt que d'éditer celui-ci si la surcharge est locale/temporaire.
#
# La règle Nematocera précède volontairement celle de Diptera : un diptère nématocère porte
# les deux rangs ("sous-ordre": "Nematocera" et "ordre": "Diptera") dans sa chaîne de
# classification, et seule la première règle qui matche est retenue.

- when:
    field: rangs.embranchement
    eq: Cnidaria
  return:
  - cnidaire
- when:
    any_of:
    - field: rangs.infra-ordre
      eq: Gekkota
    - field: rangs.famille
      eq: Gekkonidae
  return:
  - gecko
- when:
    field: rangs.ordre
    eq: Testudines
  return:
  - tortue

# Arthropodes (arachnides et ordres apparentés)
- when:
    any_of:
    - field: rangs.sous-classe
      eq: Acari
    - field: rangs.superordre
      eq: Acari
    - field: rangs.ordre
      eq: Acari
  return:
  - acarien
- when:
    field: rangs.ordre
    eq: Amblypygi
  return:
  - amblypyge
- when:
    field: rangs.ordre
